name: Deploy Worker
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler (fixed stable version)
        run: npm install -g wrangler@4.130.0

      - name: Deploy to Cloudflare Workers
        env:
          RAW_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 清除换行、回车隐藏字符
          export CLOUDFLARE_API_TOKEN=$(echo -n "$RAW_CLOUDFLARE_TOKEN" | tr -d '\n\r')
          wrangler deploy
